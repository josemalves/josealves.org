<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e10600"/>
      <stop offset="100%" style="stop-color:#00d4ff"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0a0a0f"/>

  <!-- Chip body -->
  <rect x="14" y="14" width="36" height="36" rx="4" fill="#12121a" stroke="url(#glow)" stroke-width="2.5" filter="url(#neon)"/>

  <!-- Circuit traces - left -->
  <line x1="3" y1="25" x2="14" y2="25" stroke="#e10600" stroke-width="2" filter="url(#neon)"/>
  <line x1="3" y1="39" x2="14" y2="39" stroke="#e10600" stroke-width="2" filter="url(#neon)"/>

  <!-- Circuit traces - right -->
  <line x1="50" y1="25" x2="61" y2="25" stroke="#00d4ff" stroke-width="2" filter="url(#neon)"/>
  <line x1="50" y1="39" x2="61" y2="39" stroke="#00d4ff" stroke-width="2" filter="url(#neon)"/>

  <!-- Circuit traces - top -->
  <line x1="25" y1="3" x2="25" y2="14" stroke="#e10600" stroke-width="2" filter="url(#neon)"/>
  <line x1="39" y1="3" x2="39" y2="14" stroke="#00d4ff" stroke-width="2" filter="url(#neon)"/>

  <!-- Circuit traces - bottom -->
  <line x1="25" y1="50" x2="25" y2="61" stroke="#00d4ff" stroke-width="2" filter="url(#neon)"/>
  <line x1="39" y1="50" x2="39" y2="61" stroke="#e10600" stroke-width="2" filter="url(#neon)"/>

  <!-- Pin dots -->
  <circle cx="3" cy="25" r="2" fill="#e10600"/>
  <circle cx="3" cy="39" r="2" fill="#e10600"/>
  <circle cx="61" cy="25" r="2" fill="#00d4ff"/>
  <circle cx="61" cy="39" r="2" fill="#00d4ff"/>
  <circle cx="25" cy="3" r="2" fill="#e10600"/>
  <circle cx="39" cy="3" r="2" fill="#00d4ff"/>
  <circle cx="25" cy="61" r="2" fill="#00d4ff"/>
  <circle cx="39" cy="61" r="2" fill="#e10600"/>

  <!-- JA text -->
  <text x="32" y="37" font-family="Arial Black, sans-serif" font-weight="900" font-size="16" fill="url(#glow)" text-anchor="middle" filter="url(#neon)">JA</text>
</svg>
