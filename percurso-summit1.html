<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summit 1.0 | José Alves</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --accent-red: #e10600;
            --accent-orange: #ff6b35;
            --accent-yellow: #ffd700;
            --accent-cyan: #00d4ff;
            --text-primary: #f0f0f5;
            --text-secondary: #8888aa;
            --text-muted: #555570;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            background-image:
                linear-gradient(rgba(225, 6, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(225, 6, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-red);
            text-decoration: none;
            padding: 10px 18px;
            border: 1px solid rgba(225, 6, 0, 0.4);
            border-radius: 6px;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .back-btn:hover {
            background: rgba(225, 6, 0, 0.15);
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(225, 6, 0, 0.3);
        }

        /* Main Container */
        .page-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 30px 60px;
        }

        /* Event Header */
        .event-header {
            margin-bottom: 50px;
        }

        .event-date {
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            color: var(--accent-red);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-variant: small-caps;
            margin-bottom: 12px;
        }

        .event-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.2;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .event-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-red), var(--accent-orange));
            margin-top: 20px;
            border-radius: 2px;
        }

        /* Description Section */
        .description-section {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 35px;
            margin-bottom: 50px;
        }

        .description-section h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }

        .description-section p {
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-secondary);
            text-align: justify;
        }

        /* Photo Gallery */
        .gallery-section {
            margin-bottom: 50px;
        }

        .gallery-section h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .photo-gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
            cursor: pointer;
        }

        .photo-gallery img:hover {
            transform: scale(1.05);
            border-color: var(--accent-cyan);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.15);
        }

        /* Footer */
        .page-footer {
            text-align: center;
            padding: 40px 0 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 60px;
        }

        .page-footer p {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-container {
                padding: 90px 18px 40px;
            }

            .event-title {
                font-size: 1.8rem;
            }

            .back-btn {
                font-size: 0.65rem;
                padding: 8px 14px;
                top: 12px;
                left: 12px;
            }

            .description-section {
                padding: 22px;
            }

            .photo-gallery {
                grid-template-columns: 1fr;
            }

            .photo-gallery img {
                height: 220px;
            }
        }
    </style>
</head>
<body>

    <a href="jose-site.html#percurso" class="back-btn">&#8592; Voltar ao Percurso</a>

    <div class="page-container">

        <div class="event-header">
            <p class="event-date">Fevereiro 2020</p>
            <h1 class="event-title">Summit 1.0</h1>
        </div>

        <div class="description-section">
            <h2>Sobre o Evento</h2>
            <p>O primeiro grande evento. Palestras, workshops e networking no mundo da tecnologia e formação.</p>
        </div>

        <div class="gallery-section">
            <h2>Galeria de Fotos</h2>
            <div class="photo-gallery">
                <img src="Formacao/2020_02 Summit 1.0/hardware 2.jpg" alt="Summit 1.0 - Hardware" loading="lazy">
                <img src="Formacao/2020_02 Summit 1.0/IMG_4014.JPEG" alt="Summit 1.0 - Foto 2" loading="lazy">
                <img src="Formacao/2020_02 Summit 1.0/IMG_4069.JPEG" alt="Summit 1.0 - Foto 3" loading="lazy">
            </div>
        </div>

        <footer class="page-footer">
            <p>&copy; 2025 José Alves</p>
        </footer>

    </div>

</body>
</html>
